name: Release

# Tag v* builds the AAR from source and attaches it, with its sha256, to a GitHub release.
# Consumers pin the tag and the sha256. No Maven publishing in this fork.

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Name and hash
        run: |
          out="libmpv-${GITHUB_REF_NAME}.aar"
          cp libmpv/build/outputs/aar/libmpv-release.aar "$out"
          sha256sum "$out" | tee "$out.sha256"
          unzip -l "$out" | grep '\.so$' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            libmpv-${{ github.ref_name }}.aar
            libmpv-${{ github.ref_name }}.aar.sha256
